  <!-- Application Logic -->
  <script>
    // State Variables
    let fileQueue = []; // [{ id, name, originalImage, paths, filters, width, height }]
    let activeFileIndex = -1;
    let currentTool = 'pan'; // 'pan', 'brush', 'eraser'
    
    // Viewport State
    let scale = 1;
    let offset = { x: 0, y: 0 };
    let isPanning = false;
    let startPanPoint = { x: 0, y: 0 };

    // Drawing State
    let isDrawing = false;
    let currentPath = null;

    // Element References
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const emptyState = document.getElementById('emptyState');
    const dropOverlay = document.getElementById('dropOverlay');

    // Initialize Lucide Icons
    lucide.createIcons();

    // Section Accordion Toggle
    function toggleSection(id) {
      const section = document.getElementById(id);
      const icon = document.getElementById(`${id}-icon`);
      section.classList.toggle('hidden');
      if (icon) {
        icon.style.transform = section.classList.contains('hidden') ? 'rotate(-90deg)' : 'rotate(0deg)';
      }
    }

    // Default filters
    function getDefaultFilters() {
      return { brightness: 100, contrast: 100, saturation: 100, hue: 0, blur: 0 };
    }

    // Handle Image Upload (Multiple files supported)
    function handleImageUpload(e) {
      const files = Array.from(e.target.files);
      if (files.length > 0) loadFiles(files);
      e.target.value = ''; // Reset input
    }

    function loadFiles(files) {
      const imageFiles = files.filter(f => f.type.startsWith('image/'));
      let loadedCount = 0;

      imageFiles.forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const item = {
              id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
              name: file.name,
              originalImage: img,
              paths: [],
              filters: getDefaultFilters(),
              width: img.width,
              height: img.height
            };
            fileQueue.push(item);
            loadedCount++;

            if (activeFileIndex === -1) {
              setActiveFile(fileQueue.length - 1);
            } else {
              updateQueueUI();
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function setActiveFile(index) {
      if (index < 0 || index >= fileQueue.length) {
        activeFileIndex = -1;
        emptyState.classList.remove('hidden');
        canvasWrapper.classList.add('hidden');
        updateQueueUI();
        return;
      }

      activeFileIndex = index;
      const activeItem = fileQueue[activeFileIndex];

      canvas.width = activeItem.width;
      canvas.height = activeItem.height;
      document.getElementById('resizeWidth').value = activeItem.width;
      document.getElementById('resizeHeight').value = activeItem.height;

      syncFilterControlsUI(activeItem.filters);
      resetViewport();
      emptyState.classList.add('hidden');
      canvasWrapper.classList.remove('hidden');
      
      updateQueueUI();
      drawAll();
    }

    function removeFile(index, e) {
      if (e) e.stopPropagation();
      fileQueue.splice(index, 1);
      if (fileQueue.length === 0) {
        setActiveFile(-1);
      } else if (activeFileIndex >= fileQueue.length) {
        setActiveFile(fileQueue.length - 1);
      } else {
        setActiveFile(activeFileIndex);
      }
    }

    function clearAllFiles() {
      fileQueue = [];
      setActiveFile(-1);
    }

    function updateQueueUI() {
      const container = document.getElementById('fileListContainer');
      document.getElementById('fileCount').innerText = fileQueue.length;

      if (fileQueue.length === 0) {
        container.innerHTML = '<div id="emptyQueueText" class="text-[10px] text-gray-500 text-center py-2">No files loaded</div>';
        return;
      }

      container.innerHTML = fileQueue.map((item, idx) => `
        <div onclick="setActiveFile(${idx})" class="flex items-center justify-between p-1.5 rounded text-xs cursor-pointer ${idx === activeFileIndex ? 'bg-blue-600/30 border border-blue-500/50 text-white' : 'bg-[#1c1c1c] hover:bg-[#252525] text-gray-400'}">
          <div class="flex items-center gap-2 truncate">
            <span class="w-4 h-4 rounded bg-[#333] text-[9px] flex items-center justify-center font-bold shrink-0">${idx + 1}</span>
            <span class="truncate text-[10px]">${item.name}</span>
          </div>
          <button onclick="removeFile(${idx}, event)" class="p-0.5 hover:text-red-400 transition-colors">
            <i data-lucide="x" class="w-3 h-3"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    // Filter Controls
    function updateFilter(key, val, unit) {
      if (activeFileIndex === -1) return;
      fileQueue[activeFileIndex].filters[key] = Number(val);
      document.getElementById(`val-${key}`).innerText = val + unit;
      drawAll();
    }

    function syncFilterControlsUI(filters) {
      ['brightness', 'contrast', 'saturation'].forEach(k => {
        document.getElementById(k).value = filters[k];
        document.getElementById(`val-${k}`).innerText = `${filters[k]}%`;
      });
      document.getElementById('hue').value = filters.hue;
      document.getElementById('val-hue').innerText = `${filters.hue}°`;
      document.getElementById('blur').value = filters.blur;
      document.getElementById('val-blur').innerText = `${filters.blur}px`;
    }

    function resetFilters() {
      if (activeFileIndex === -1) return;
      fileQueue[activeFileIndex].filters = getDefaultFilters();
      fileQueue[activeFileIndex].paths = [];
      syncFilterControlsUI(fileQueue[activeFileIndex].filters);
      drawAll();
    }

    function applyAdjustmentsToAll() {
      if (activeFileIndex === -1) return;
      const currentFilters = { ...fileQueue[activeFileIndex].filters };
      fileQueue.forEach(f => {
        f.filters = { ...currentFilters };
      });
    }

    // Pattern Generator
    function getPattern(type, color) {
      if (type === 'solid') return color;
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 16; pCanvas.height = 16;
      const pCtx = pCanvas.getContext('2d');
      pCtx.fillStyle = color;

      if (type === 'checkerboard') {
        pCtx.fillRect(0, 0, 8, 8); pCtx.fillRect(8, 8, 8, 8);
      } else if (type === 'dots') {
        pCtx.beginPath(); pCtx.arc(8, 8, 4, 0, Math.PI * 2); pCtx.fill();
      } else if (type === 'stripes') {
        pCtx.fillRect(0, 0, 16, 4); pCtx.fillRect(0, 8, 16, 4);
      } else if (type === 'grid') {
        pCtx.fillRect(0, 0, 16, 2); pCtx.fillRect(0, 0, 2, 16);
      } else if (type === 'noise') {
        for (let x = 0; x < 16; x += 2) {
          for (let y = 0; y < 16; y += 2) {
            if ((x * 37 + y * 13) % 5 === 0) pCtx.fillRect(x, y, 2, 2);
          }
        }
      }
      return ctx.createPattern(pCanvas, 'repeat') || color;
    }

    // Redraw Active Canvas Stack
    function drawAll() {
      if (activeFileIndex === -1) return;
      const activeItem = fileQueue[activeFileIndex];
      renderFileToCanvas(activeItem, canvas, ctx);
    }

    function renderFileToCanvas(item, targetCanvas, targetCtx) {
      targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);

      // Render base image with CSS filters
      const f = item.filters;
      targetCtx.filter = `brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturation}%) blur(${f.blur}px) hue-rotate(${f.hue}deg)`;
      targetCtx.drawImage(item.originalImage, 0, 0, targetCanvas.width, targetCanvas.height);
      targetCtx.filter = 'none';

      // Render drawing paths
      item.paths.forEach(p => renderPathToContext(p, targetCtx));
    }

    function renderPathToContext(path, targetCtx) {
      if (path.points.length < 1) return;
      targetCtx.save();
      targetCtx.beginPath();
      targetCtx.globalCompositeOperation = path.isEraser ? 'destination-out' : 'source-over';
      targetCtx.strokeStyle = path.isEraser ? '#000' : getPattern(path.mask, path.color);
      targetCtx.lineWidth = path.size;
      targetCtx.globalAlpha = path.opacity / 100;
      targetCtx.filter = path.falloff > 0 ? `blur(${path.falloff}px)` : 'none';
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';

      targetCtx.moveTo(path.points[0].x, path.points[0].y);
      for (let i = 1; i < path.points.length; i++) {
        targetCtx.lineTo(path.points[i].x, path.points[i].y);
      }
      targetCtx.stroke();
      targetCtx.restore();
    }

    // Tool Management
    function setTool(tool) {
      currentTool = tool;
      ['pan', 'brush', 'eraser'].forEach(t => {
        const btn = document.getElementById(`tool-${t}`);
        if (t === tool) {
          btn.classList.add('bg-blue-600', '!text-white');
        } else {
          btn.classList.remove('bg-blue-600', '!text-white');
        }
      });

      if (tool === 'pan') {
        canvas.className = 'max-w-full max-h-full block cursor-grab';
      } else {
        canvas.className = 'max-w-full max-h-full block cursor-crosshair';
      }
    }

    // Pointer Event Handlers
    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    function handlePointerDown(e) {
      if (activeFileIndex === -1) return;

      if (e.button === 1 || currentTool === 'pan') {
        isPanning = true;
        startPanPoint = { x: e.clientX - offset.x, y: e.clientY - offset.y };
        if (currentTool === 'pan') canvas.style.cursor = 'grabbing';
        return;
      }

      if (currentTool === 'brush' || currentTool === 'eraser') {
        isDrawing = true;
        const pt = getCanvasCoordinates(e);
        currentPath = {
          points: [pt],
          color: document.getElementById('brushColor').value,
          size: Number(document.getElementById('brushSize').value),
          opacity: Number(document.getElementById('brushOpacity').value),
          falloff: Number(document.getElementById('brushFalloff').value),
          mask: document.getElementById('brushMask').value,
          isEraser: currentTool === 'eraser'
        };
        fileQueue[activeFileIndex].paths.push(currentPath);
        drawAll();
      }
    }

    function handlePointerMove(e) {
      if (isPanning) {
        offset.x = e.clientX - startPanPoint.x;
        offset.y = e.clientY - startPanPoint.y;
        updateTransform();
        return;
      }

      if (isDrawing && currentPath) {
        const pt = getCanvasCoordinates(e);
        currentPath.points.push(pt);
        drawAll();
      }
    }

    function handlePointerUp() {
      if (isPanning) {
        isPanning = false;
        if (currentTool === 'pan') canvas.style.cursor = 'grab';
      }
      isDrawing = false;
      currentPath = null;
    }

    // Zooming & Pan Transform Logic
    function handleWheel(e) {
      if (activeFileIndex === -1) return;
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
      adjustZoom(zoomFactor);
    }

    function adjustZoom(factor) {
      scale = Math.max(0.1, Math.min(10, scale * factor));
      document.getElementById('zoomScale').innerText = `${Math.round(scale * 100)}%`;
      updateTransform();
    }

    function resetViewport() {
      scale = 1;
      offset = { x: 0, y: 0 };
      document.getElementById('zoomScale').innerText = '100%';
      updateTransform();
    }

    function updateTransform() {
      canvasWrapper.style.transform = `translate(${offset.x}px, ${offset.y}px) scale(${scale})`;
    }

    // Resizing Logic
    function handleWidthChange(val) {
      if (document.getElementById('maintainAspect').checked && activeFileIndex !== -1 && val) {
        const activeItem = fileQueue[activeFileIndex];
        const ratio = activeItem.height / activeItem.width;
        document.getElementById('resizeHeight').value = Math.round(val * ratio);
      }
    }

    function handleHeightChange(val) {
      if (document.getElementById('maintainAspect').checked && activeFileIndex !== -1 && val) {
        const activeItem = fileQueue[activeFileIndex];
        const ratio = activeItem.width / activeItem.height;
        document.getElementById('resizeWidth').value = Math.round(val * ratio);
      }
    }

    function applyResize() {
      if (activeFileIndex === -1) return;
      const newWidth = parseInt(document.getElementById('resizeWidth').value);
      const newHeight = parseInt(document.getElementById('resizeHeight').value);
      if (!newWidth || !newHeight) return;

      const activeItem = fileQueue[activeFileIndex];
      const scaleX = newWidth / activeItem.width;
      const scaleY = newHeight / activeItem.height;

      activeItem.paths = activeItem.paths.map(path => ({
        ...path,
        points: path.points.map(p => ({ x: p.x * scaleX, y: p.y * scaleY })),
        size: path.size * Math.max(scaleX, scaleY)
      }));

      activeItem.width = newWidth;
      activeItem.height = newHeight;
      canvas.width = newWidth;
      canvas.height = newHeight;

      drawAll();
    }

    // Drag and Drop Handling
    function handleDragOver(e) {
      e.preventDefault();
      dropOverlay.classList.remove('hidden');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      if (e.relatedTarget === null || !document.getElementById('viewport').contains(e.relatedTarget)) {
        dropOverlay.classList.add('hidden');
      }
    }

    function handleDrop(e) {
      e.preventDefault();
      dropOverlay.classList.add('hidden');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        loadFiles(Array.from(e.dataTransfer.files));
      }
    }

    // Export & Image Optimizer
    function toggleQualityControl() {
      const format = document.getElementById('exportFormat').value;
      const container = document.getElementById('qualityContainer');
      container.classList.toggle('hidden', format === 'image/png');
    }

    function getFormattedExtension(mimeType) {
      if (mimeType === 'image/jpeg') return 'jpg';
      if (mimeType === 'image/webp') return 'webp';
      return 'png';
    }

    function downloadActiveImage() {
      if (activeFileIndex === -1) return;
      const format = document.getElementById('exportFormat').value;
      const quality = Number(document.getElementById('exportQuality').value) / 100;
      const ext = getFormattedExtension(format);
      
      const activeItem = fileQueue[activeFileIndex];
      const baseName = activeItem.name.substring(0, activeItem.name.lastIndexOf('.')) || activeItem.name;

      const link = document.createElement('a');
      link.download = `${baseName}_optimized.${ext}`;
      link.href = canvas.toDataURL(format, quality);
      link.click();
    }

    async function downloadAllZip() {
      if (fileQueue.length === 0) return;

      const format = document.getElementById('exportFormat').value;
      const quality = Number(document.getElementById('exportQuality').value) / 100;
      const ext = getFormattedExtension(format);
      const statusText = document.getElementById('exportStatus');
      const btn = document.getElementById('btnBatchDownload');

      btn.disabled = true;
      statusText.classList.remove('hidden');
      statusText.innerText = 'Compressing & Zipping...';

      const zip = new JSZip();

      for (let i = 0; i < fileQueue.length; i++) {
        const item = fileQueue[i];
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = item.width;
        tempCanvas.height = item.height;
        const tempCtx = tempCanvas.getContext('2d');

        renderFileToCanvas(item, tempCanvas, tempCtx);

        const dataUrl = tempCanvas.toDataURL(format, quality);
        const base64Data = dataUrl.split(',')[1];
        const baseName = item.name.substring(0, item.name.lastIndexOf('.')) || item.name;

        zip.file(`${baseName}_compressed.${ext}`, base6464ToBlobData(base64Data, format));
      }

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(zipBlob);
      link.download = `compressed_textures_${Date.now()}.zip`;
      link.click();

      btn.disabled = false;
      statusText.classList.add('hidden');
    }

    function base6464ToBlobData(base64, mimeType) {
      const byteCharacters = atob(base64);
      const byteArrays = [];
      for (let offset = 0; offset < byteCharacters.length; offset += 512) {
        const slice = byteCharacters.slice(offset, offset + 512);
        const byteNumbers = new Array(slice.length);
        for (let i = 0; i < slice.length; i++) {
          byteNumbers[i] = slice.charCodeAt(i);
        }
        byteArrays.push(new Uint8Array(byteNumbers));
      }
      return new Blob(byteArrays, { type: mimeType });
    }
  </script>
</body>
